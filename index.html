<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANZZCENZZ-STORE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* ================= DESAIN CSS POP-ART NEOBRUTALISM ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
        }
        .bg-grid-telur-asin {
            background-color: #a3e4d7;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.08) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 2px, transparent 2px);
            background-size: 25px 25px;
            transition: background-color 0.4s ease;
        }
        .bg-grid-abu-abu {
            background-color: #9e9e9e;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.12) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.12) 2px, transparent 2px);
            background-size: 25px 25px;
            transition: background-color 0.4s ease;
        }
        .border-brutal {
            border: 4px solid #000000 !important;
        }
        .hidden {
            display: none !important;
        }
        .page-layout {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .anim-fade-in { animation: fadeIn 0.6s ease forwards; }
        .anim-bounce-up { animation: bounceUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-pop-in { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        .pulse-dot { animation: dotPulse 1.5s infinite ease-in-out; }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }
        button:active, .btn-join:active, .menu-icon:active, .btn-buy:active {
            transform: translateY(3px) translateX(2px) !important;
            box-shadow: 1px 1px 0px #000000 !important;
        }
        
        /* Halaman 1 */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 20px 25px 0 0;
        }
        .btn-skip {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            border: 4px solid #000000;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin-top: -40px;
        }
        .logo-circle-outer {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid #000000;
            background: conic-gradient(#1abc9c, #e74c3c, #f1c40f, #1abc9c);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-circle-inner {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #2980b9, #3498db);
            border: 4px solid #000000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 5px 0px #000000;
        }
        .logo-text {
            color: #ffffff;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000000;
        }
        .store-name-title {
            margin-top: 35px;
            font-family: 'Permanent Marker', cursive;
            font-size: 22px;
            color: #000000;
        }
        .loading-box {
            margin-top: 45px;
            background-color: #000000;
            color: #ffffff;
            border-radius: 24px;
            padding: 20px 35px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0px 8px 0px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        /* Halaman 2 & Pop-up QRIS */
        .popup-overlay-active {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .popup-card {
            background-color: #ffffff;
            border-radius: 32px;
            width: 350px;
            padding: 30px 20px 25px 20px;
            position: relative;
            box-shadow: 8px 8px 0px #000000, -4px 15px 0px #f4d03f;
        }
        .close-btn {
            position: absolute;
            top: -15px; right: -10px;
            background-color: #e74c3c;
            color: #ffffff;
            border: 3px solid #000000;
            width: 38px; height: 38px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #000000;
        }
        .popup-header { display: flex; justify-content: space-between; align-items: center; }
        .sub-title { font-size: 11px; font-weight: 700; color: #7f8c8d; }
        .status-badge {
            background-color: #e8f8f5; color: #27ae60;
            border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700;
            display: flex; align-items: center;
        }
        .dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; margin-right: 6px; }
        .divider-dots {
            border-bottom: 4px dashed #000000;
            margin: 15px 0 20px 0;
            width: 100%;
        }
        .popup-body { display: flex; align-items: center; margin-bottom: 25px; }
        .wa-icon-container {
            background-color: #25d366;
            border-radius: 16px; width: 65px; height: 65px;
            display: flex; align-items: center; justify-content: center; margin-right: 15px;
        }
        .wa-text h3 { font-size: 17px; font-weight: 700; color: #000000; }
        .wa-text p { font-size: 10.5px; color: #7f8c8d; font-weight: 600; margin-top: 4px;}
        .btn-join {
            display: flex; align-items: center; justify-content: center;
            background-color: #2ecc71; color: #000000; text-decoration: none;
            font-weight: 700; font-size: 15px; border-radius: 16px; padding: 14px 0;
            width: 100%; box-shadow: 0px 5px 0px #000000;
        }

        /* Halaman 3 (Dashboard) */
        #dashboard-screen {
            width: 100%;
            padding: 20px;
            padding-bottom: 120px;
        }
        .navbar-top { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .menu-icon {
            background-color: #ffffff; border-radius: 12px; padding: 10px;
            display: flex; flex-direction: column; gap: 4px; box-shadow: 2px 2px 0px #000000;
            cursor: pointer;
        }
        .menu-icon span { width: 20px; height: 3px; background-color: #000000; }
        .status-banner {
            background-color: #000000; color: #ffffff;
            border-radius: 30px; padding: 8px 20px; flex-grow: 1;
            font-size: 12px; font-weight: 700;
            display: flex; align-items: center; justify-content: space-between;
        }
        .text-online { color: #2ecc71; }
        .dot-green { width: 10px; height: 10px; background-color: #2ecc71; border-radius: 50%; }
        .story-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; }
        .story-item { display: flex; flex-direction: column; align-items: center; min-width: 75px; }
        .story-item span { font-size: 10px; font-weight: 600; margin-top: 8px; }
        .story-circle {
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .add-story { background-color: #ffffff; font-size: 24px; box-shadow: 2px 2px 0px #000000; }
        .profile-pic { background-color: #e74c3c; }
        .empty-story { background-color: #ffffff; }
        .qr-story { background-color: #ffffff; display: flex; align-items: center; justify-content: center;}
        
        .dashboard-title { font-size: 26px; font-weight: 700; margin-bottom: 20px; }
        .dashboard-title span { color: #2980b9; }
        .card-large {
            background-color: #000000; color: #ffffff;
            border-radius: 16px; padding: 25px; margin-bottom: 20px;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.25);
        }
        .card-subtitle { font-size: 12px; font-weight: 700; opacity: 0.8; }
        .time-display { font-size: 45px; font-weight: 700; margin: 10px 0; }
        .date-display { font-size: 16px; font-weight: 600; }
        .card-row { display: flex; gap: 15px; margin-bottom: 20px; }

            flex: 1; background-color: #000000; color: #ffffff;
