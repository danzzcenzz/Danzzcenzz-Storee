<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANZZCENZZ-STORE</title>
    <style>
        /* ================= DESAIN CSS NEOBRUTALISM POP-ART ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #9e9e9e;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.12) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.12) 2px, transparent 2px);
            background-size: 25px 25px;
            overflow-x: hidden;
        }
        .border-brutal {
            border: 4px solid #000000 !important;
        }
        .hidden {
            display: none !important;
        }

        /* ---------------- ANIMASI LOADING OPENING SCREEN ---------------- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #a3e4d7;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.08) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 2px, transparent 2px);
            background-size: 25px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
        }
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 25px 25px 0 0;
        }
        .btn-skip {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 14px;
            border: 4px solid #000000;
            padding: 10px 22px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin-top: -60px;
        }
        
        /* Lingkaran Luar Berputar Menggunakan CSS Murni */
        .logo-circle-outer {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid #000000;
            background: conic-gradient(#1abc9c, #e74c3c, #f1c40f, #1abc9c);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spinCircle 2s linear infinite;
        }
        @keyframes spinCircle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Menjaga Text Tetap Tegak Saat Lingkaran Luar Berputar */
        .logo-circle-inner {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #2980b9, #3498db);
            border: 4px solid #000000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 5px 0px #000000;
            animation: counterSpin 2s linear infinite;
        }
        @keyframes counterSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        .logo-text {
            color: #ffffff;
            font-size: 55px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000000;
        }
        .store-name-title {
            margin-top: 25px;
            font-size: 18px;
            color: #000000;
            font-weight: 850;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Kotak Status Loading Biru Kontras Sesuai Foto Kedua */
        .loading-box-blue {
            margin-top: 35px;
            background-color: #3498db;
            color: #ffffff;
            border: 4px solid #000000;
            border-radius: 16px;
            padding: 15px 25px;
            text-align: center;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 5px 5px 0px #000000;
            width: 290px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pulse-dot { animation: dotPulse 1.5s infinite ease-in-out; }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
        }

        /* ---------------- HALAMAN UTAMA TOKO ---------------- */
        #store-screen {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .store-avatar-box {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: linear-gradient(135deg, #2980b9, #3498db);
            display: flex; align-items: center; justify-content: center;
            font-size: 45px; color: #ffffff;
            box-shadow: 0px 6px 0px #000000;
            margin-bottom: 10px;
            border: 4px solid #000000;
        }
        .store-username {
            font-size: 18px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 5px;
        }
        .store-bio {
            font-size: 12px;
            color: #333333;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
        }
        .list-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px;
        }
        .product-item-link {
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 15px 18px;
            border-radius: 16px;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            width: 100%;
            text-align: left;
            border: 3px solid #000000;
            transition: all 0.1s ease;
        }
        .product-item-link:active, .btn-join:active, .btn-skip:active {
            transform: translateY(3px) translateX(2px);
            box-shadow: 1px 1px 0px #000000;
        }
        .product-icon-frame {
            width: 45px;
            height: 45px;
            background-color: #f4d03f;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 15px;
            flex-shrink: 0;
            border: 2px solid #ffffff;
        }
        .product-text-details {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .prod-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
            line-height: 1.3;
        }
        .prod-price {
            font-size: 11px;
            color: #2ecc71;
            font-weight: 700;
            margin-top: 3px;
        }
        .arrow-indicator {
            font-size: 15px;
            color: #ffffff;
            margin-left: 10px;
        }

        /* Halaman 3: Pop-up WA Mengambang */
        .popup-overlay-active {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        .popup-card {
            background-color: #ffffff;
            border-radius: 32px;
            width: 350px;
            padding: 30px 20px 25px 20px;
            position: relative;
            box-shadow: 8px 8px 0px #000000, -4px 15px 0px #f4d03f;
            border: 4px solid #000000;
        }
        .close-btn {
            position: absolute;
            top: -15px; right: -10px;
            background-color: #e74c3c;
            color: #ffffff;
            border: 3px solid #000000;
            width: 38px; height: 38px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #000000;
        }
        .popup-header { display: flex; justify-content: space-between; align-items: center; }
        .sub-title { font-size: 11px; font-weight: 700; color: #7f8c8d; }
        .status-badge {
            background-color: #e8f8f5; color: #27ae60;
            border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700;
            display: flex; align-items: center;
        }
        .dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; margin-right: 6px; }
        .divider-dots {
            border-bottom: 4px dashed #000000;
            margin: 15px 0 20px 0;
            width: 100%;
        }
        .popup-body { display: flex; align-items: center; margin-bottom: 25px; }
        .wa-icon-container {
            background-color: #25d366;
            border-radius: 16px; width: 65px; height: 65px;
            display: flex; align-items: center; justify-content: center; margin-right: 15px;
            border: 3px solid #000000;
            font-size: 32px;
        }
        .wa-text h3 { font-size: 17px; font-weight: 700; color: #000000; }
