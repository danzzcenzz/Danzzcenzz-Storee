<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanzzCenzz Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan Font Inter agar tampilan teks bersih dan modern -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Container Utama Aplikasi -->
    <div class="app-container">
        
        <!-- ================= HALAMAN BERANDA ================= -->
        <section id="page-beranda" class="page-content active">
            <div class="header-store">
                <!-- Logo bulat sesuai permintaan -->
                <div class="logo-container">
                    <img src="https://i.imgur.com/ykHAwfs.png" alt="Danzz Store Logo" class="logo-img">
                </div>
                <h1>@danzzcenzz.store</h1>
                <p class="tagline">⚡ Sell video terbaru viral/hot tentu harga murah meriah ⚡</p>
            </div>

            <!-- Area Simulasi Pembelian / Produk -->
            <div class="produk-section">
                <div class="card-produk">
                    <h3>Paket Video Viral Terbaru</h3>
                    <p class="harga">Rp 15.000</p>
                    <button class="btn-beli" onclick="bukaModalKonfirmasi('Paket Video Viral Terbaru', 'Rp 15.000')">Beli Sekarang</button>
                </div>
            </div>
        </section>

        <!-- ================= HALAMAN RIWAYAT ================= -->
        <section id="page-riwayat" class="page-content">
            <div class="box-riwayat-wrapper">
                <div class="header-riwayat">
                    <span class="icon-riwayat">📋</span>
                    <h2>RIWAYAT TRANSAKSI</h2>
                </div>
                
                <!-- Tempat daftar transaksi akan di-render otomatis oleh JavaScript -->
                <div id="daftar-riwayat-konten">
                    <p class="status-kosong">🔸 Belum ada riwayat pesanan.</p>
                </div>
            </div>
        </section>

        <!-- ================= HALAMAN PROFIL ================= -->
        <section id="page-profil" class="page-content">
            <div class="profile-section">
                <div class="profile-avatar"></div>
                <h2>Pengguna Setia</h2>
                <p>danzzcustomer@gmail.com</p>
            </div>
        </section>

        <!-- ================= MODAL KONFIRMASI PEMBAYARAN ================= -->
        <div id="modal-pembayaran" class="modal-overlay">
            <div class="modal-box">
                <h3>Konfirmasi Pembayaran</h3>
                <p id="modal-detail-produk">Apakah Anda ingin mengonfirmasi pembayaran untuk produk ini?</p>
                <div class="modal-actions">
                    <button class="btn-batal" onclick="tutupModal()">Batal</button>
                    <button class="btn-konfirmasi" onclick="prosesKonfirmasiPembayaran()">Konfirmasi</button>
                </div>
            </div>
        </div>

        <!-- ================= BOTTOM NAVIGATION BAR ================= -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchPage('beranda', this)">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Beranda</span>
            </button>
            <button class="nav-item" onclick="switchPage('riwayat', this)">
                <span class="nav-icon">⏱️</span>
                <span class="nav-label">Riwayat</span>
            </button>
            <button class="nav-item" onclick="switchPage('profil', this)">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profil</span>
            </button>
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
