name: Notifikasi Pesanan

'on':
  workflow_dispatch:

jobs:
  kirim-notifikasi:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang Firebase Admin
        run: npm install firebase-admin

      - name: Kirim notifikasi tes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATABASE_URL: https://danzzcenzz-store-default-rtdb.asia-southeast1.firebasedatabase.app
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(
            process.env.FIREBASE_SERVICE_ACCOUNT
          );

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: process.env.DATABASE_URL
          });

          async function main() {
            const snapshot = await admin.database().ref('admin token').once('value');
            const token = snapshot.val();

            if (!token) {
              throw new Error('Token admin tidak ditemukan di Firebase.');
            }

            await admin.messaging().send({
              token: token,
              notification: {
                title: 'DANZZCENZZ STORE',
                body: 'Notifikasi tes berhasil!'
              }
            });

            console.log('Notifikasi berhasil dikirim.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
